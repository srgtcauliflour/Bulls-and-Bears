name: Safari iOS unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: ["main", "feat/refactor-safari-v0.1"]
    paths: ["extension/**", ".github/workflows/safari-ios.yml"]
  pull_request:
    paths: ["extension/**", ".github/workflows/safari-ios.yml"]
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 toolchain
        shell: bash
        run: |
          XCODE_VERSION="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Xcode: $XCODE_VERSION"
          echo "iPhoneOS SDK: $SDK_VERSION"
          [[ "$XCODE_VERSION" == 27.* ]] || { echo "::error::Xcode 27 is required"; exit 1; }
          test -n "$SDK_VERSION" || { echo "::error::No iPhoneOS SDK is available"; exit 1; }
      - name: Validate shared JavaScript
        run: |
          node --check extension/core.js
          node --check extension/popup.js
      - name: Select Safari packaging tool
        id: safari_tool
        shell: bash
        run: |
          echo "Active Xcode:"
          xcodebuild -version
          if xcrun --find safari-web-extension-packager >/dev/null 2>&1; then
            TOOL=safari-web-extension-packager
          elif xcrun --find safari-web-extension-converter >/dev/null 2>&1; then
            TOOL=safari-web-extension-converter
          else
            echo "::error::Neither Safari Web Extension packager nor legacy converter is installed in the active Xcode."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          echo "Using $TOOL"
          echo "tool=$TOOL" >> "$GITHUB_OUTPUT"
      - name: Create valid PNG icons from bundled logo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib
          # Small valid PNG fallback used for Safari/Xcode packaging until the
          # full-resolution brand PNG is committed as a binary repository asset.
          png=base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAC0lEQVR4nO3BAQ0AAADCoPdPbQ43oAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAvg0QAAABJRU5ErkJggg==")
          a=pathlib.Path("extension/assets"); a.mkdir(parents=True,exist_ok=True)
          for n in (16,32,48,128):
              (a/f"icon-{n}.png").write_bytes(png)
          PY
          python3 - <<'PY'
          import json
          p="extension/manifest.json"
          with open(p) as f:m=json.load(f)
          icons={s:f"assets/icon-{s}.png" for s in ("16","32","48","128")}
          m["icons"]=icons
          m.setdefault("action",{})["default_icon"]=icons
          with open(p,"w") as f:json.dump(m,f,indent=2)
          PY
          test "$(xxd -p -l 8 extension/assets/icon-128.png)" = "89504e470d0a1a0a"

      - name: Package Safari Web Extension
        run: |
          xcrun "${{ steps.safari_tool.outputs.tool }}" extension --project-location "$PWD/safari-generated" --app-name BullsAndBears --bundle-identifier com.srgtcauliflour.BullsAndBears --swift --ios-only --copy-resources --no-open --no-prompt --force
          find safari-generated -maxdepth 3 -type f | sort
      - name: Discover project and iOS scheme
        id: discover
        shell: bash
        run: |
          PROJECT="$(find safari-generated -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          xcodebuild -project "$PROJECT" -list
          SCHEME="$(xcodebuild -project "$PROJECT" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d.get("project",{}).get("schemes",[]); print(next((x for x in s if "iOS" in x), s[0] if s else ""))')"
          test -n "$SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
      - name: Build unsigned iOS app
        run: |
          rm -rf "$RUNNER_TEMP/bb-build"
          xcodebuild -project "${{ steps.discover.outputs.project }}" -scheme "${{ steps.discover.outputs.scheme }}" -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/bb-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        shell: bash
        run: |
          APP="$(find "$RUNNER_TEMP/bb-build/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/BullsAndBears-Safari-v0.1-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: BullsAndBears-Safari-v0.1-unsigned
          path: BullsAndBears-Safari-v0.1-unsigned.ipa
          if-no-files-found: error
